[package]
name = "fsight"
version = "0.1.0"
edition = "2024"
description = "Fast filesystem insight: disk usage, find, grep, duplicate detection, statistics and an interactive explorer"
readme = "readme.md"
keywords = ["disk-usage", "find", "grep", "duplicates", "tui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = "4.6.12"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
ctrlc = "3.5.3"
globset = "0.4.21"
ignore = "0.4.34"
indicatif = "0.18.6"
owo-colors = "4.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

# Keep debug builds light on a modest machine: line tables are enough for
# backtraces, and optimising dependencies a little makes tests much faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
