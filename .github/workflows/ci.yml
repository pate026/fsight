# Runs the same three quality gates as local development (see readme.md)
# on Linux and macOS for every push and pull request.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep CI output readable and builds lean.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install stable Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Release build
        run: cargo build --release
